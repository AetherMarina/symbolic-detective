[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-detective"
version = "0.1.0"
description = "Computational iconography engine for discovering and comparing visual motifs."
readme = "README.md"
authors = [
  { name="Marina Kaličanin", email="marina.feel.ai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "torch",
    "torchvision"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]