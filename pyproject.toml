[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-detective"
version = "0.1.0"
description = "Computational iconography engine for discovering and comparing visual motifs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name="Marina Kaličanin"}
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "streamlit>=1.35.0",
    "torch>=2.11.0,<3.0",
    "torchvision>=0.26.0,<1.0",
    "scikit-learn>=1.7.0,<2.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]